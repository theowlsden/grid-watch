# Grid Watch on Coolify (spec 7.6). In Coolify: "Docker Compose" resource from this Git
# repository, base directory /, compose file /docker-compose.yaml. It lives at the repo root
# because Docker Compose resolves build contexts against the project directory, which Coolify
# sets to the repo root. Domains are set per service in the
# Coolify UI (web on port 8080, cms on port 8090); Coolify's proxy provides TLS.
# Secrets and settings come from Coolify environment variables; see deploy/README.md.

services:
  web:
    build:
      context: .
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      # added to the CSP connect-src so the page may fetch news from the CMS
      CMS_ORIGIN: ${CMS_ORIGIN:-}
    volumes:
      - gridwatch-data:/var/lib/gridwatch:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Coolify shows each service's health from these checks; the proxy only routes to healthy ones
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
      start_interval: 5s

  cms:
    build:
      context: .
      dockerfile: deploy/cms/Dockerfile
    restart: unless-stopped
    expose:
      - "8090"
    environment:
      SITE_ORIGIN: ${SITE_ORIGIN:?set SITE_ORIGIN, e.g. https://grid.noirvisuals.studio}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:-}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:-}
      PB_ADMIN_IPS: ${PB_ADMIN_IPS:-}
      # restricted account for the Telegram bot (news only), kept in sync on every start
      PB_BOT_EMAIL: ${PB_BOT_EMAIL:-}
      PB_BOT_PASSWORD: ${PB_BOT_PASSWORD:-}
    volumes:
      - pb-data:/pb/pb_data
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # unhealthy (not restarting) when a setting is wrong: the log says which (deploy/cms/entrypoint.sh)
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8090/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s
      start_interval: 5s

  pipeline:
    build:
      context: .
      dockerfile: deploy/pipeline/Dockerfile
    restart: unless-stopped
    environment:
      # 1 publishes the live outlook to /data/forecast.json; anything else keeps it as a preview
      # at /data/preview/forecast.json (view it with ?preview=1) and the site keeps its data
      GRIDWATCH_PUBLISH: ${GRIDWATCH_PUBLISH:-0}
      OPEN_METEO_API_KEY: ${OPEN_METEO_API_KEY:-}
    volumes:
      - gridwatch-data:/var/lib/gridwatch
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # healthy while the last run succeeded within 36 hours (the first run happens on start)
    healthcheck:
      test: ["CMD", "python", "pipeline/healthcheck.py"]
      interval: 2m
      timeout: 10s
      retries: 2
      start_period: 3m
      start_interval: 10s

  # bot: Telegram news bot (Phase 1b), long polling, no public route. Added in the bot step.

volumes:
  gridwatch-data:
  pb-data:
