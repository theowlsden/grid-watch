name: Data correction
description: Correct or add a reported event, a figure or a site position. A public source is required.
labels: [data]
body:
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: The event, figure or position, and the corrected value.
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source URL
      description: A public report, article or document. Corrections without a source cannot be accepted.
    validations:
      required: true
  - type: input
    id: source_meta
    attributes:
      label: Publisher, title and publication date
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
