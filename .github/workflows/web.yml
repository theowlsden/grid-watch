name: Web

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Licences (production dependencies must allow MIT distribution, spec 12b)
        # @img/sharp-libvips (LGPL) is an optional build-time image tool of Next.js; a static
        # export never uses it and nothing of it ships in out/.
        run: npm run licenses

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build (static export)
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (spec 11)
        run: npx playwright test

      - name: Upload report and screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          retention-days: 14

  images:
    # Build the deploy images (no push) so a broken Dockerfile is caught before Coolify sees it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - name: Build web, cms and pipeline images
        env:
          SITE_ORIGIN: https://grid.example.org
        run: docker compose -f docker-compose.yaml build
