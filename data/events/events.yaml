# Reported grid events in Curaçao (spec 8.4). Source of truth for /data/events.json.
#
# Rules
# - Every event needs at least one public source. Entries with TODO source fields are kept
#   here but NOT published: build_events.py leaves them out of events.json until every
#   source field is filled in.
# - No unsourced claims about the utility. Summaries describe what the source reports.
# - Titles and source names stay in their original language.
# - start_local / end_local: a date (YYYY-MM-DD) when no time was reported, otherwise a
#   local date-time with the Curaçao offset, e.g. 2025-08-27T02:30:00-04:00.
# - type: blackout | outage | controlled_switching | shortage | warning
# - severity: major (blackout, major outage) or minor (controlled switching, shortage, controlled outages)
# - drivers: wind_drop, heat, high_demand, maintenance, capacity_shortfall, battery_reliance
# - verified: true once the entry has been checked against its sources.
#
# Rebuild the JSON after editing:  python pipeline/tools/build_events.py

- id: 2025-08-27-blackout
  title: Island-wide blackout
  start_local: "2025-08-27T02:30:00-04:00"
  end_local: null
  type: blackout
  severity: major
  drivers: [wind_drop]
  summary: >-
    Wind output fell sharply around 02:30 and the disturbance grew into a full system
    collapse. Investigated by Aqualectra and DNV.
  sources:
    - publisher: TODO
      title: TODO
      url: TODO
      published_at: TODO
      retrieved_at: TODO
  verified: false

